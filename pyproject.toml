[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-mcp-server"
version = "0.1.0"
description = "MCP server for Gmail integration with unread email listing, filtering, delete and archive capabilities"
authors = [{name = "Gmail MCP Server", email = "noreply@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.29.0,<2.0.0",  # 2.0.0 removes the Server.list_tools()/call_tool() decorator API used here; requires a dedicated migration
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
    "google-auth-httplib2>=0.4.1",
    "google-api-python-client>=2.198.0",
    "flask>=3.1.3",
    "starlette>=1.6.0",
    "cryptography>=50.0.0",  # transitive via google-auth; pinned to fix CVE-2026-69247 (GHSA-g6cj-pr64-35w5)
]

[project.scripts]
gmail-mcp-server = "gmail_mcp_server.server:main"
gmail-mcp-auth = "gmail_mcp_server.auth:main"

[tool.setuptools.packages.find]
include = ["gmail_mcp_server*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",
    "UP006",
    "UP007",
    "UP035",
]

[tool.ruff.lint.isort]
known-first-party = ["gmail_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["gmail_mcp_server", "app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true