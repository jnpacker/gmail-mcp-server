[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-mcp-server"
version = "0.1.0"
description = "MCP server for Gmail integration with unread email listing, filtering, delete and archive capabilities"
authors = [{name = "Gmail MCP Server", email = "noreply@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28.1",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "google-auth-httplib2>=0.4.0",
    "google-api-python-client>=2.196.0",
    "flask>=3.1.3",
    "starlette>=1.1.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
gmail-mcp-server = "gmail_mcp_server.server:main"
gmail-mcp-auth = "gmail_mcp_server.auth:main"

[tool.setuptools.packages.find]
include = ["gmail_mcp_server*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",
    "UP006",
    "UP007",
    "UP035",
]

[tool.ruff.lint.isort]
known-first-party = ["gmail_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["gmail_mcp_server", "app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true